<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{doc_title}}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.55;
      color: #1f2937;
      margin: 28px;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 24px 0;
      padding-bottom: 12px;
      border-bottom: 2px solid #e5e7eb;
    }

    .task {
      margin-top: 40px;
      page-break-before: always;
    }

    .task:first-of-type {
      page-break-before: auto;
    }

    .meta {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
      color: #4b5563;
      font-size: 14px;
    }

    .task-question {
      margin: 12px 0 18px;
      padding: 12px;
      background: #f9fafb;
      border-left: 4px solid #9ca3af;
    }

    .sub-question {
      margin: 14px 0 20px;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
    }

    .question {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .solution {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .label {
      font-weight: 700;
    }

    .fa-wrap {
      margin: 12px 0;
    }

    .fa {
      direction: rtl;
      text-align: right;
      font-family: Tahoma, Arial, sans-serif;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 10px;
      unicode-bidi: plaintext;
      white-space: pre-wrap;
    }

    .exam-tips {
      color: #333;
    }

    .exam-tips ul {
      margin: 8px 0 0 20px;
    }

    @media print {
      body {
        margin: 12mm;
      }
    }
  </style>
</head>
<body>
  <h1>{{doc_title}}</h1>
  {{tasks_html}}
</body>
</html>
